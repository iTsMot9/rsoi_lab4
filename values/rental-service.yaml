service:
  name: "rental-service"
  replicaCount: 2
  image:
    repository: "cr.yandex/<folder-id>/rsoi-registry/rental-service"
    tag: "latest"
  ports:
    containerPort: 8060
    servicePort: 80
  env:
    - name: DATABASE_URL
      value: "postgresql://program:test@postgres-postgresql:5432/rentals"
    - name: CAR_SERVICE_URL
      value: "http://cars-service-service:80"
    - name: PAYMENT_SERVICE_URL
      value: "http://payment-service-service:80"
    - name: PORT
      value: "8060"
ingress:
  host: "rental.<external-ip>.nip.io"
