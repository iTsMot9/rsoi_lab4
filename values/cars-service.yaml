service:
  name: "cars-service"
  replicaCount: 2
  image:
    repository: "cr.yandex/<folder-id>/rsoi-registry/cars-service"
    tag: "latest"
  ports:
    containerPort: 8070
    servicePort: 80
  env:
    - name: DATABASE_URL
      value: "postgresql://program:test@postgres-postgresql:5432/cars"
    - name: PORT
      value: "8070"
ingress:
  host: "cars.<external-ip>.nip.io"
