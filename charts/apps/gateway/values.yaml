nameOverride: gateway
fullnameOverride: gateway

replicaCount: 2 

image:
  repository: itsmot9/gateway-service
  tag: latest
  pullPolicy: Always

app:
  port: 8080
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  ingressClassName: "nginx"
  hosts:
    - host: gateway.158.160.206.47.nip.io
      paths:
        - path: /
          pathType: Prefix

env:
  CAR_SERVICE_URL: "http://car-service:8070"
  RENTAL_SERVICE_URL: "http://rental-service:8060"
  PAYMENT_SERVICE_URL: "http://payment-service:8050"
  
livenessProbe:
  port: 8080
  path: /health
