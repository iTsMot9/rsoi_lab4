apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
spec:
  replicas: {{ .Values.service.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
    spec:
      containers:
      - name: {{ .Values.service.name }}
        image: "{{ .Values.service.image.repository }}:{{ .Values.service.image.tag }}"
        imagePullPolicy: {{ .Values.service.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.ports.containerPort }}
        env:
        {{- range .Values.service.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.service.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.service.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.service.readinessProbe | nindent 10 }}
