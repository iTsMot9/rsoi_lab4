postgresql:
  auth:
    username: "postgres"
    password: "postgres"
    database: "postgres"
    existingSecret: "postgres-secrets"
  
  primary:
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 1000m
    
    persistence:
      enabled: false
    
    containerSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
    
    podSecurityContext:
      fsGroup: 1001
    
    initdb:
      scriptsConfigMap: "postgres-init-scripts"
    
    extraEnvVars:
      - name: POSTGRESQL_INITSCRIPTS_DIR
        value: /docker-entrypoint-initdb.d
    
    extendedConfiguration: |
      max_connections = 100
      shared_buffers = 128MB
      effective_cache_size = 384MB
      maintenance_work_mem = 32MB
      checkpoint_completion_target = 0.9
      wal_buffers = 3840kB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 1638kB
      min_wal_size = 1GB
      max_wal_size = 4GB
      max_worker_processes = 2
      max_parallel_workers_per_gather = 1
      max_parallel_workers = 2
      max_parallel_maintenance_workers = 1
    
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
  
  volumePermissions:
    enabled: true
  
  service:
    type: ClusterIP
    port: 5432
  
  networkPolicy:
    enabled: false
  
  metrics:
    enabled: false
