name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
name: GitHub Classroom Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Yandex Container Registry
      uses: docker/login-action@v3
      with:
        registry: cr.yandex
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Configure Yandex Cloud CLI
      run: |
        # Install YC CLI
        curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yandex-cloud
        
        echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
        export PATH="/home/runner/yandex-cloud/bin:$PATH"
        
        echo "Verifying YC CLI installation..."
        which yc
        yc --version
        
        yc config profile create github-actions
        
        echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /home/runner/key.json
        
        yc config set service-account-key /home/runner/key.json
        
        yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
        yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
        
        echo "=== YC Config ==="
        yc config list
        echo "=== Cloud Info ==="
        yc resource-manager cloud list
        echo "=== Folder Info ==="
        yc resource-manager folder list
      env:
        YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
        YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}

    - name: Get cluster credentials
      run: |
        echo "Getting credentials for cluster: rsoi-lab4-cluster"
        yc managed-kubernetes cluster get-credentials rsoi-lab4-cluster --external --force
        echo "Current kubeconfig contexts:"
        kubectl config get-contexts
        echo "Using context: yc-rsoi-lab4-cluster"
        kubectl config use-context yc-rsoi-lab4-cluster
        echo "Verifying cluster access:"
        kubectl cluster-info

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.12.0'

    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update

    - name: Build and push Docker images
      run: |
        FOLDER_ID=${{ secrets.YC_FOLDER_ID }}
        REGISTRY_URL=cr.yandex/$FOLDER_ID/rsoi-registry

        echo "Building and pushing gateway service"
        docker build -t $REGISTRY_URL/gateway:latest ./src/gateway
        docker push $REGISTRY_URL/gateway:latest

        echo "Building and pushing payment-service"
        docker build -t $REGISTRY_URL/payment-service:latest ./src/payment-service
        docker push $REGISTRY_URL/payment-service:latest

        echo "Building and pushing rental-service"
        docker build -t $REGISTRY_URL/rental-service:latest ./src/rental-service
        docker push $REGISTRY_URL/rental-service:latest

        echo "Building and pushing cars-service"
        docker build -t $REGISTRY_URL/cars-service:latest ./src/cars-service
        docker push $REGISTRY_URL/cars-service:latest

    - name: Create database initialization resources
      run: |
        # Create secrets for PostgreSQL
        kubectl create secret generic postgres-secrets \
          --from-literal=postgres-password=postgres \
          --from-literal=program-password=test \
          --dry-run=client -o yaml | kubectl apply -f -

        kubectl create configmap postgres-init-scripts \
          --from-file=./src/schema-3.sql \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy database
      run: |
        helm upgrade --install postgres bitnami/postgresql \
          --set auth.username=postgres \
          --set auth.password=postgres \
          --set auth.database=postgres \
          --set auth.existingSecret=postgres-secrets \
          --set primary.persistence.enabled=false \
          --set primary.initdb.scriptsConfigMap=postgres-init-scripts \
          --set primary.extraEnvVars[0].name=POSTGRESQL_INITSCRIPTS_DIR \
          --set primary.extraEnvVars[0].value=/docker-entrypoint-initdb.d
      continue-on-error: true

    - name: Wait for database to be ready
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=postgres --timeout=300s
        echo "PostgreSQL is ready"

    - name: Deploy services
      run: |
        FOLDER_ID=${{ secrets.YC_FOLDER_ID }}
        EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "127.0.0.1")
        
        if [ "$EXTERNAL_IP" = "127.0.0.1" ]; then
          echo "Warning: Could not get external IP, using localhost"
        fi

        echo "External IP: $EXTERNAL_IP"

        kubectl create namespace rsoi --dry-run=client -o yaml | kubectl apply -f -

        helm upgrade --install gateway charts/common \
          --namespace rsoi \
          --set service.name=gateway \
          --set service.image.repository=cr.yandex/$FOLDER_ID/rsoi-registry/gateway \
          --set service.image.tag=latest \
          --set service.ports.containerPort=8080 \
          --set service.ports.servicePort=80 \
          --set ingress.host=gateway.$EXTERNAL_IP.nip.io \
          --set service.env[0].name=CAR_SERVICE_URL \
          --set service.env[0].value=http://cars-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[1].name=RENTAL_SERVICE_URL \
          --set service.env[1].value=http://rental-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[2].name=PAYMENT_SERVICE_URL \
          --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[3].name=PORT \
          --set service.env[3].value=8080

        helm upgrade --install payment-service charts/common \
          --namespace rsoi \
          --set service.name=payment-service \
          --set service.image.repository=cr.yandex/$FOLDER_ID/rsoi-registry/payment-service \
          --set service.image.tag=latest \
          --set service.ports.containerPort=8050 \
          --set service.ports.servicePort=80 \
          --set ingress.host=payment.$EXTERNAL_IP.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/payments \
          --set service.env[1].name=PORT \
          --set service.env[1].value=8050

        helm upgrade --install rental-service charts/common \
          --namespace rsoi \
          --set service.name=rental-service \
          --set service.image.repository=cr.yandex/$FOLDER_ID/rsoi-registry/rental-service \
          --set service.image.tag=latest \
          --set service.ports.containerPort=8060 \
          --set service.ports.servicePort=80 \
          --set ingress.host=rental.$EXTERNAL_IP.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/rentals \
          --set service.env[1].name=CAR_SERVICE_URL \
          --set service.env[1].value=http://cars-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[2].name=PAYMENT_SERVICE_URL \
          --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[3].name=PORT \
          --set service.env[3].value=8060

        helm upgrade --install cars-service charts/common \
          --namespace rsoi \
          --set service.name=cars-service \
          --set service.image.repository=cr.yandex/$FOLDER_ID/rsoi-registry/cars-service \
          --set service.image.tag=latest \
          --set service.ports.containerPort=8070 \
          --set service.ports.servicePort=80 \
          --set ingress.host=cars.$EXTERNAL_IP.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/cars \
          --set service.env[1].name=PORT \
          --set service.env[1].value=8070

    - name: Verify deployment
      run: |
        echo "=== Checking pods ==="
        kubectl get pods -n rsoi -o wide

        echo "=== Checking services ==="
        kubectl get services -n rsoi

        echo "=== Checking Ingress ==="
        kubectl get ingress -n rsoi

        echo "=== Waiting for services to be ready ==="
        timeout=300
        step=10
        
        echo "Waiting for gateway pod..."
        kubectl wait --for=condition=ready pod -l app=gateway -n rsoi --timeout=${timeout}s || true
        
        echo "Waiting for payment-service pod..."
        kubectl wait --for=condition=ready pod -l app=payment-service -n rsoi --timeout=${timeout}s || true
        
        echo "Waiting for rental-service pod..."
        kubectl wait --for=condition=ready pod -l app=rental-service -n rsoi --timeout=${timeout}s || true
        
        echo "Waiting for cars-service pod..."
        kubectl wait --for=condition=ready pod -l app=cars-service -n rsoi --timeout=${timeout}s || true

        FOLDER_ID=${{ secrets.YC_FOLDER_ID }}
        EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "127.0.0.1")
        
        GATEWAY_URL="http://gateway.$EXTERNAL_IP.nip.io"
        PAYMENT_URL="http://payment.$EXTERNAL_IP.nip.io"
        RENTAL_URL="http://rental.$EXTERNAL_IP.nip.io"
        CARS_URL="http://cars.$EXTERNAL_IP.nip.io"

        echo "Testing service endpoints:"
        echo "Gateway: $GATEWAY_URL/health"
        curl -s -o /dev/null -w "%{http_code}\n" $GATEWAY_URL/health || echo "Gateway health check failed"

        echo "Payment: $PAYMENT_URL/health"
        curl -s -o /dev/null -w "%{http_code}\n" $PAYMENT_URL/health || echo "Payment health check failed"

        echo "Rental: $RENTAL_URL/health"
        curl -s -o /dev/null -w "%{http_code}\n" $RENTAL_URL/health || echo "Rental health check failed"

        echo "Cars: $CARS_URL/health"
        curl -s -o /dev/null -w "%{http_code}\n" $CARS_URL/health || echo "Cars health check failed"

    - name: Autograding
      uses: education/autograding@v1
      continue-on-error: true
