name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run unit tests
        run: |
          cd src/car-service
          pip install -r requirements.txt
          python -m pytest test_main.py
          cd ../..
          
          cd src/gateway
          pip install -r requirements.txt
          python -m pytest test_main.py
          cd ../..
          
          cd src/payment-service
          pip install -r requirements.txt
          python -m pytest test_main.py
          cd ../..
          
          cd src/rental-service
          pip install -r requirements.txt
          python -m pytest test_main.py
          cd ../..

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yandex-cloud
          echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud CLI
        run: |
          yc config set service-account-key "${{ secrets.YC_SERVICE_ACCOUNT_KEY }}"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Login to Yandex Container Registry
        run: |
          yc container registry configure-docker
          yc container registry get "${{ secrets.YC_FOLDER_ID }}/rsoi-registry" || yc container registry create --name rsoi-registry

      - name: Build and push Docker images
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          # Build and push car-service
          docker build -t cr.yandex/${YC_FOLDER_ID}/rsoi-registry/car-service:latest ./src/car-service
          docker push cr.yandex/${YC_FOLDER_ID}/rsoi-registry/car-service:latest
          
          # Build and push gateway
          docker build -t cr.yandex/${YC_FOLDER_ID}/rsoi-registry/gateway:latest ./src/gateway
          docker push cr.yandex/${YC_FOLDER_ID}/rsoi-registry/gateway:latest
          
          # Build and push payment-service
          docker build -t cr.yandex/${YC_FOLDER_ID}/rsoi-registry/payment-service:latest ./src/payment-service
          docker push cr.yandex/${YC_FOLDER_ID}/rsoi-registry/payment-service:latest
          
          # Build and push rental-service
          docker build -t cr.yandex/${YC_FOLDER_ID}/rsoi-registry/rental-service:latest ./src/rental-service
          docker push cr.yandex/${YC_FOLDER_ID}/rsoi-registry/rental-service:latest

      - name: Setup KUBECONFIG
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify kubectl connection
        run: kubectl get nodes

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy PostgreSQL database
        run: |
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./postgres/postgres-pvc.yaml -n default
          kubectl apply -f ./postgres/postgres-configmap.yaml -n default
          kubectl apply -f ./postgres/postgres-deployment.yaml -n default
          kubectl apply -f ./postgres/postgres-service.yaml -n default

      - name: Wait for PostgreSQL to be ready
        run: |
          kubectl wait -n default deployment/postgres --for=condition=Available --timeout=5m
          sleep 30

      - name: Deploy all microservices
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          # Update image repositories in values.yaml files
          sed -i "s|repository: .*|repository: cr.yandex/${YC_FOLDER_ID}/rsoi-registry/car-service|" ./charts/apps/car-service/values.yaml
          sed -i "s|repository: .*|repository: cr.yandex/${YC_FOLDER_ID}/rsoi-registry/gateway|" ./charts/apps/gateway/values.yaml
          sed -i "s|repository: .*|repository: cr.yandex/${YC_FOLDER_ID}/rsoi-registry/payment-service|" ./charts/apps/payment-service/values.yaml
          sed -i "s|repository: .*|repository: cr.yandex/${YC_FOLDER_ID}/rsoi-registry/rental-service|" ./charts/apps/rental-service/values.yaml
          
          helm upgrade --install car-service ./charts/common -f ./charts/apps/car-service/values.yaml -n default
          helm upgrade --install gateway ./charts/common -f ./charts/apps/gateway/values.yaml -n default
          helm upgrade --install payment-service ./charts/common -f ./charts/apps/payment-service/values.yaml -n default
          helm upgrade --install rental-service ./charts/common -f ./charts/apps/rental-service/values.yaml -n default

      - name: Wait for services to be ready with health checks
        run: |
          echo "Waiting for gateway service health check..."
          kubectl wait -n default deployment/gateway --for=condition=Available --timeout=5m
          kubectl run -n default --rm -i --restart=Never curl-gateway --image=curlimages/curl -- curl -f http://gateway:8080/health || exit 1
          
          echo "Waiting for car-service health check..."
          kubectl wait -n default deployment/car-service --for=condition=Available --timeout=5m
          kubectl run -n default --rm -i --restart=Never curl-car --image=curlimages/curl -- curl -f http://car-service:8070/health || exit 1
          
          echo "Waiting for payment-service health check..."
          kubectl wait -n default deployment/payment-service --for=condition=Available --timeout=5m
          kubectl run -n default --rm -i --restart=Never curl-payment --image=curlimages/curl -- curl -f http://payment-service:8050/health || exit 1
          
          echo "Waiting for rental-service health check..."
          kubectl wait -n default deployment/rental-service --for=condition=Available --timeout=5m
          kubectl run -n default --rm -i --restart=Never curl-rental --image=curlimages/curl -- curl -f http://rental-service:8060/health || exit 1

      - name: Check Ingress resources
        run: kubectl get ingress -n default

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
