name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Deploy and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push gateway service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/gateway-service:${{ github.sha }} ./src/gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/gateway-service:${{ github.sha }}

      - name: Build and push car service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/car-service:${{ github.sha }} ./src/car-service
          docker push ${{ secrets.DOCKER_USERNAME }}/car-service:${{ github.sha }}

      - name: Build and push rental service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rental-service:${{ github.sha }} ./src/rental-service
          docker push ${{ secrets.DOCKER_USERNAME }}/rental-service:${{ github.sha }}

      - name: Build and push payment service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }} ./src/payment-service
          docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }}
          
      - name: Set up dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure Yandex Cloud CLI
        id: configure-yc
        uses: yandex-cloud/actions/setup@v1
        with:
          yc-service-account-key: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
          yc-cloud-id: ${{ secrets.YC_CLOUD_ID }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}

      - name: Login to Yandex Container Registry
        run: yc container registry configure-docker --folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: |
          kubectl create namespace rsoi-lab4 --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL database
        run: |
          kubectl apply -f postgres/postgres-configmap.yaml -n rsoi-lab4
          kubectl apply -f postgres/postgres-pvc.yaml -n rsoi-lab4
          kubectl apply -f postgres/postgres-deployment.yaml -n rsoi-lab4
          kubectl apply -f postgres/postgres-service.yaml -n rsoi-lab4

      - name: Wait for PostgreSQL to be ready
        run: |
          kubectl wait -n rsoi-lab4 deployment/postgres --for=condition=Available --timeout=300s
          sleep 10

      - name: Deploy gateway service
        run: |
          helm upgrade --install gateway charts/common \
            -f charts/apps/gateway/values.yaml \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/gateway-service \
            --set image.tag=${{ github.sha }} \
            --namespace rsoi-lab4

      - name: Deploy car service
        run: |
          helm upgrade --install car-service charts/common \
            -f charts/apps/car-service/values.yaml \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/car-service \
            --set image.tag=${{ github.sha }} \
            --namespace rsoi-lab4

      - name: Deploy rental service
        run: |
          helm upgrade --install rental-service charts/common \
            -f charts/apps/rental-service/values.yaml \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/rental-service \
            --set image.tag=${{ github.sha }} \
            --namespace rsoi-lab4

      - name: Deploy payment service
        run: |
          helm upgrade --install payment-service charts/common \
            -f charts/apps/payment-service/values.yaml \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/payment-service \
            --set image.tag=${{ github.sha }} \
            --namespace rsoi-lab4

      - name: Wait for all services to be ready
        run: |
          kubectl wait -n rsoi-lab4 deployment/gateway --for=condition=Available --timeout=120s
          kubectl wait -n rsoi-lab4 deployment/car-service --for=condition=Available --timeout=120s
          kubectl wait -n rsoi-lab4 deployment/rental-service --for=condition=Available --timeout=120s
          kubectl wait -n rsoi-lab4 deployment/payment-service --for=condition=Available --timeout=120s
          sleep 30

      - name: Check service endpoints
        run: |
          echo "=== Checking gateway service ==="
          kubectl get svc -n rsoi-lab4 gateway
          
          echo "=== Checking car-service ==="
          kubectl get svc -n rsoi-lab4 car-service
          
          echo "=== Checking rental-service ==="
          kubectl get svc -n rsoi-lab4 rental-service
          
          echo "=== Checking payment-service ==="
          kubectl get svc -n rsoi-lab4 payment-service
          
          echo "=== Checking PostgreSQL ==="
          kubectl get svc -n rsoi-lab4 postgres

      - name: Run fault tolerance tests
        run: |
          ./scripts/test-script.sh v3 gateway rsoi-lab4
        env:
          VARIANT: v3

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
        with:
          test-script: ./scripts/test-script.sh
          args: v3 gateway rsoi-lab4
