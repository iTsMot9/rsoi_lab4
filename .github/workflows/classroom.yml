name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Yandex Cloud CLI
      run: |
        curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yandex-cloud
        echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
        export PATH="/home/runner/yandex-cloud/bin:$PATH"
        sudo apt-get update
        sudo apt-get install -y jq curl
        yc config profile create github-actions
        echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /home/runner/key.json
        yc config set service-account-key /home/runner/key.json
        yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
        yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

    - name: Login to Yandex Container Registry
      run: |
        yc container registry configure-docker --folder-id ${{ secrets.YC_FOLDER_ID }}

    - name: Verify Container Registry exists
      id: verify-registry
      run: |
        FOLDER_ID=${{ secrets.YC_FOLDER_ID }}
        REGISTRY_NAME="rsoi-registry"
        echo "Checking if registry '$REGISTRY_NAME' exists in folder $FOLDER_ID..."
        REGISTRY_INFO=$(yc container registry list --folder-id $FOLDER_ID --format json | jq -r '.[] | select(.name == "'$REGISTRY_NAME'")')
        if [ -z "$REGISTRY_INFO" ] || [ "$REGISTRY_INFO" == "null" ]; then
          echo "Registry '$REGISTRY_NAME' not found. Creating it now..."
          yc container registry create --name $REGISTRY_NAME --folder-id $FOLDER_ID
          echo "Registry created successfully"
          REGISTRY_INFO=$(yc container registry list --folder-id $FOLDER_ID --format json | jq -r '.[] | select(.name == "'$REGISTRY_NAME'")')
        fi
        REGISTRY_ID=$(echo "$REGISTRY_INFO" | jq -r '.id')
        echo "Registry ID: $REGISTRY_ID"
        echo "registry_id=$REGISTRY_ID" >> $GITHUB_OUTPUT

    - name: Get cluster credentials
      run: |
        CLUSTER_NAME="rsoi-lab4-cluster"
        echo "Getting credentials for cluster: $CLUSTER_NAME"
        CLUSTER_INFO=$(yc managed-kubernetes cluster list --folder-id ${{ secrets.YC_FOLDER_ID }} --format json | jq -r '.[] | select(.name == "'$CLUSTER_NAME'")')
        if [ -z "$CLUSTER_INFO" ] || [ "$CLUSTER_INFO" == "null" ]; then
          echo "Cluster $CLUSTER_NAME not found. Please create it first."
          exit 1
        fi
        yc managed-kubernetes cluster get-credentials $CLUSTER_NAME --external --force
        kubectl config use-context yc-$CLUSTER_NAME
        kubectl cluster-info

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.12.0'

    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami  
        helm repo update

    - name: Validate Helm charts
      run: |
        echo "Validating Helm chart syntax..."
        helm lint charts/common || {
          echo "Helm chart validation failed. Check YAML syntax in charts/common/templates/"
          exit 1
        }

    - name: Build and push Docker images
      run: |
        REGISTRY_ID=${{ steps.verify-registry.outputs.registry_id }}
        echo "Using registry ID: $REGISTRY_ID"
        
        docker pull hello-world:latest
        docker tag hello-world:latest cr.yandex/$REGISTRY_ID/test:latest
        docker push cr.yandex/$REGISTRY_ID/test:latest
        docker rmi cr.yandex/$REGISTRY_ID/test:latest || true
        
        # Убираем :latest из тегов для избежания кэширования проблем
        TIMESTAMP=$(date +%s)
        docker build -t cr.yandex/$REGISTRY_ID/gateway:$TIMESTAMP ./src/gateway
        docker push cr.yandex/$REGISTRY_ID/gateway:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/payment-service:$TIMESTAMP ./src/payment-service
        docker push cr.yandex/$REGISTRY_ID/payment-service:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/rental-service:$TIMESTAMP ./src/rental-service
        docker push cr.yandex/$REGISTRY_ID/rental-service:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/cars-service:$TIMESTAMP ./src/cars-service
        docker push cr.yandex/$REGISTRY_ID/cars-service:$TIMESTAMP

    - name: Create database initialization resources
      run: |
        kubectl create namespace rsoi --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic postgres-secrets \
          --from-literal=postgres-password=postgres \
          --from-literal=program-password=test \
          --namespace rsoi \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create configmap postgres-init-scripts \
          --from-file=./src/schema-3.sql \
          --namespace rsoi \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy database
      run: |
        helm upgrade --install postgres bitnami/postgresql \
          --namespace rsoi \
          --set auth.username=postgres \
          --set auth.password=postgres \
          --set auth.database=postgres \
          --set auth.existingSecret=postgres-secrets \
          --set primary.persistence.enabled=false \
          --set primary.initdb.scriptsConfigMap=postgres-init-scripts \
          --set primary.extraEnvVars[0].name=POSTGRESQL_INITSCRIPTS_DIR \
          --set primary.extraEnvVars[0].value=/docker-entrypoint-initdb.d \
          --set primary.service.ports.postgresql=5432 \
          --set fullnameOverride=postgres

    - name: Wait for database to be ready
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=postgres -n rsoi --timeout=300s
        
        # Дополнительная проверка доступности БД
        kubectl run db-check --image=postgres:13 --namespace rsoi --rm -i --restart=Never -- \
          psql -h postgres-postgresql.rsoi.svc.cluster.local -U postgres -c "\l" -d postgres || {
          echo "❌ Database is not accessible!"
          echo "=== PostgreSQL pod logs ==="
          kubectl logs -n rsoi -l app.kubernetes.io/instance=postgres --tail=50
          exit 1
        }

    - name: Deploy services
      run: |
        REGISTRY_ID=${{ steps.verify-registry.outputs.registry_id }}
        TIMESTAMP=$(date +%s)
        
        # Получаем внешний IP для Ingress
        for i in {1..10}; do
          EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ ! -z "$EXTERNAL_IP" ] && [ "$EXTERNAL_IP" != "null" ]; then
            break
          fi
          sleep 10
        done
        EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
        
        echo "Deploying gateway service..."
        helm upgrade --install gateway charts/common \
          --namespace rsoi \
          --set service.name=gateway \
          --set service.image.repository=cr.yandex/$REGISTRY_ID/gateway \
          --set service.image.tag=$TIMESTAMP \
          --set service.ports.containerPort=8080 \
          --set service.ports.servicePort=80 \
          --set ingress.enabled=true \
          --set ingress.host=gateway.${EXTERNAL_IP}.nip.io \
          --set service.env[0].name=CAR_SERVICE_URL \
          --set service.env[0].value=http://cars-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[1].name=RENTAL_SERVICE_URL \
          --set service.env[1].value=http://rental-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[2].name=PAYMENT_SERVICE_URL \
          --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[3].name=PORT \
          --set service.env[3].value=8080 \
          # Отключаем readinessProbe - КЛЮЧЕВОЕ ИЗМЕНЕНИЕ!
          --set service.readinessProbe.enabled=false \
          --set service.livenessProbe.enabled=false
        
        echo "Deploying payment service..."
        helm upgrade --install payment-service charts/common \
          --namespace rsoi \
          --set service.name=payment-service \
          --set service.image.repository=cr.yandex/$REGISTRY_ID/payment-service \
          --set service.image.tag=$TIMESTAMP \
          --set service.ports.containerPort=8050 \
          --set service.ports.servicePort=80 \
          --set ingress.enabled=true \
          --set ingress.host=payment.${EXTERNAL_IP}.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/payments \
          --set service.env[1].name=PORT \
          --set service.env[1].value=8050 \
          # Отключаем readinessProbe - КЛЮЧЕВОЕ ИЗМЕНЕНИЕ!
          --set service.readinessProbe.enabled=false \
          --set service.livenessProbe.enabled=false
        
        echo "Deploying rental service..."
        helm upgrade --install rental-service charts/common \
          --namespace rsoi \
          --set service.name=rental-service \
          --set service.image.repository=cr.yandex/$REGISTRY_ID/rental-service \
          --set service.image.tag=$TIMESTAMP \
          --set service.ports.containerPort=8060 \
          --set service.ports.servicePort=80 \
          --set ingress.enabled=true \
          --set ingress.host=rental.${EXTERNAL_IP}.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/rentals \
          --set service.env[1].name=CAR_SERVICE_URL \
          --set service.env[1].value=http://cars-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[2].name=PAYMENT_SERVICE_URL \
          --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 \
          --set service.env[3].name=PORT \
          --set service.env[3].value=8060 \
          # Отключаем readinessProbe - КЛЮЧЕВОЕ ИЗМЕНЕНИЕ!
          --set service.readinessProbe.enabled=false \
          --set service.livenessProbe.enabled=false
        
        echo "Deploying cars service..."
        helm upgrade --install cars-service charts/common \
          --namespace rsoi \
          --set service.name=cars-service \
          --set service.image.repository=cr.yandex/$REGISTRY_ID/cars-service \
          --set service.image.tag=$TIMESTAMP \
          --set service.ports.containerPort=8070 \
          --set service.ports.servicePort=80 \
          --set ingress.enabled=true \
          --set ingress.host=cars.${EXTERNAL_IP}.nip.io \
          --set service.env[0].name=DATABASE_URL \
          --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/cars \
          --set service.env[1].name=PORT \
          --set service.env[1].value=8070 \
          # Отключаем readinessProbe - КЛЮЧЕВОЕ ИЗМЕНЕНИЕ!
          --set service.readinessProbe.enabled=false \
          --set service.livenessProbe.enabled=false
        
        echo "=== Waiting for all services to start ==="
        sleep 30

    - name: Make test script executable
      run: chmod +x ./scripts/test-script.sh

    - name: Debug services before testing
      run: |
        echo "=== Final pod status ==="
        kubectl get pods -n rsoi -o wide --show-labels
        
        echo "=== Service endpoints ==="
        kubectl get svc -n rsoi
        
        echo "=== Gateway service details ==="
        kubectl describe svc gateway-service -n rsoi
        
        echo "=== Gateway pod logs ==="
        kubectl logs -n rsoi -l app=gateway --tail=20 || true
        
        echo "=== Database connectivity check ==="
        kubectl run test-db --image=postgres:13 --namespace rsoi --rm -i --restart=Never -- \
          psql -h postgres-postgresql.rsoi.svc.cluster.local -U program -d payments -c "SELECT 1" || echo "Database check failed"

    - name: Run API Tests
      timeout-minutes: 15
      run: |
        echo "=== Starting testing via port-forward ==="
        
        GATEWAY_POD=$(kubectl get pods -n rsoi -l app=gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$GATEWAY_POD" ]; then
          echo "❌ No gateway pod found!"
          kubectl get pods -n rsoi
          exit 1
        fi
        
        echo "Gateway pod: $GATEWAY_POD"
        echo "=== Gateway pod logs ==="
        kubectl logs -n rsoi "$GATEWAY_POD" --tail=30
        
        echo "=== Starting port-forward ==="
        kubectl port-forward "pod/$GATEWAY_POD" -n rsoi 8080:8080 &
        PORT_FORWARD_PID=$!
        echo "Port-forward PID: $PORT_FORWARD_PID"
        
        echo "=== Waiting for gateway to be ready ==="
        MAX_ATTEMPTS=20
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if curl -sSf http://localhost:8080/health >/dev/null 2>&1; then
            echo "Gateway health check passed!"
            break
          fi
          echo "Waiting for gateway... ($i/$MAX_ATTEMPTS)"
          sleep 3
          if [ $i -eq $MAX_ATTEMPTS ]; then
            echo "❌ Gateway not responding after $((MAX_ATTEMPTS*3)) seconds"
            echo "=== Detailed curl debug ==="
            curl -v http://localhost:8080/health || true
            echo "=== Service logs ==="
            kubectl logs -n rsoi "$GATEWAY_POD" --tail=50
            kill $PORT_FORWARD_PID 2>/dev/null || true
            exit 1
          fi
        done
        
        echo "=== Configuring environment for localhost ==="
        sed -i "s|http://gateway\..*\.nip\.io|http://localhost:8080|g" v3/postman/environment.json
        sed -i "s|http://localhost:8080|http://localhost:8080|g" v3/postman/environment.json
        echo "Updated environment.json:"
        cat v3/postman/environment.json
        
        echo "=== Running tests ==="
        ./scripts/test-script.sh v3 kubernetes rsoi || {
          echo "Tests failed!"
          echo "=== Debug information ==="
          echo "Current pods:"
          kubectl get pods -n rsoi
          echo "Gateway logs:"
          kubectl logs -n rsoi "$GATEWAY_POD" --tail=50
          kill $PORT_FORWARD_PID 2>/dev/null || true
          exit 1
        }
        
        kill $PORT_FORWARD_PID 2>/dev/null || true
        echo "All tests completed successfully!"
      continue-on-error: false
