name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Yandex Cloud CLI
      run: |
        curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yandex-cloud
        echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
        export PATH="/home/runner/yandex-cloud/bin:$PATH"
        sudo apt-get update
        sudo apt-get install -y jq curl
        yc config profile create github-actions
        echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /home/runner/key.json
        yc config set service-account-key /home/runner/key.json
        yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
        yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

    - name: Login to Yandex Container Registry
      run: |
        yc container registry configure-docker --folder-id ${{ secrets.YC_FOLDER_ID }}

    - name: Verify Container Registry exists
      id: verify-registry
      run: |
        FOLDER_ID=${{ secrets.YC_FOLDER_ID }}
        REGISTRY_NAME="rsoi-registry"
        echo "Checking if registry '$REGISTRY_NAME' exists in folder $FOLDER_ID..."
        REGISTRY_INFO=$(yc container registry list --folder-id $FOLDER_ID --format json | jq -r '.[] | select(.name == "'$REGISTRY_NAME'")')
        if [ -z "$REGISTRY_INFO" ] || [ "$REGISTRY_INFO" == "null" ]; then
          echo "Registry '$REGISTRY_NAME' not found. Creating it now..."
          yc container registry create --name $REGISTRY_NAME --folder-id $FOLDER_ID
          echo "Registry created successfully"
          REGISTRY_INFO=$(yc container registry list --folder-id $FOLDER_ID --format json | jq -r '.[] | select(.name == "'$REGISTRY_NAME'")')
        fi
        REGISTRY_ID=$(echo "$REGISTRY_INFO" | jq -r '.id')
        echo "Registry ID: $REGISTRY_ID"
        echo "registry_id=$REGISTRY_ID" >> $GITHUB_OUTPUT

    - name: Get cluster credentials
      run: |
        CLUSTER_NAME="rsoi-lab4-cluster"
        echo "Getting credentials for cluster: $CLUSTER_NAME"
        CLUSTER_INFO=$(yc managed-kubernetes cluster list --folder-id ${{ secrets.YC_FOLDER_ID }} --format json | jq -r '.[] | select(.name == "'$CLUSTER_NAME'")')
        if [ -z "$CLUSTER_INFO" ] || [ "$CLUSTER_INFO" == "null" ]; then
          echo "Cluster $CLUSTER_NAME not found. Please create it first."
          exit 1
        fi
        yc managed-kubernetes cluster get-credentials $CLUSTER_NAME --external --force
        kubectl config use-context yc-$CLUSTER_NAME
        kubectl cluster-info

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.12.0'

    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami  
        helm repo update

    - name: Validate Helm charts
      run: |
        echo "Validating Helm chart syntax..."
        helm lint charts/common || {
          echo "Helm chart validation failed. Check YAML syntax in charts/common/templates/"
          exit 1
        }

    - name: Build and push Docker images
      run: |
        REGISTRY_ID=${{ steps.verify-registry.outputs.registry_id }}
        echo "Using registry ID: $REGISTRY_ID"
        
        docker pull hello-world:latest
        docker tag hello-world:latest cr.yandex/$REGISTRY_ID/test:latest
        docker push cr.yandex/$REGISTRY_ID/test:latest
        docker rmi cr.yandex/$REGISTRY_ID/test:latest || true
        
        TIMESTAMP=$(date +%s)
        docker build -t cr.yandex/$REGISTRY_ID/gateway:$TIMESTAMP ./src/gateway
        docker push cr.yandex/$REGISTRY_ID/gateway:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/payment-service:$TIMESTAMP ./src/payment-service
        docker push cr.yandex/$REGISTRY_ID/payment-service:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/rental-service:$TIMESTAMP ./src/rental-service
        docker push cr.yandex/$REGISTRY_ID/rental-service:$TIMESTAMP
        
        docker build -t cr.yandex/$REGISTRY_ID/cars-service:$TIMESTAMP ./src/cars-service
        docker push cr.yandex/$REGISTRY_ID/cars-service:$TIMESTAMP

    - name: Create database initialization resources
      run: |
        kubectl create namespace rsoi --dry-run=client -o yaml | kubectl apply -f -
        
        kubectl delete secret postgres-secrets -n rsoi --ignore-not-found
        kubectl create secret generic postgres-secrets \
          --from-literal=postgresql-password=postgres \
          --from-literal=postgresql-postgres-password=postgres \
          --from-literal=postgresql-username=program \
          --from-literal=postgresql-password=test \
          --from-literal=postgresql-database=postgres \
          --namespace rsoi
        
        kubectl delete configmap postgres-init-scripts -n rsoi --ignore-not-found
        kubectl create configmap postgres-init-scripts \
          --from-file=./src/schema-3.sql \
          --namespace rsoi

    - name: Deploy PostgreSQL database
      run: |
        echo "=== Deploying PostgreSQL ==="
        
        helm uninstall postgres -n rsoi --ignore-not-found
        
        helm install postgres bitnami/postgresql \
          --namespace rsoi \
          --set global.storageClass=yc-network-ssd \
          --set auth.existingSecret=postgres-secrets \
          --set auth.username=program \
          --set auth.database=postgres \
          --set primary.persistence.enabled=false \
          --set primary.initdb.scriptsConfigMap=postgres-init-scripts \
          --set primary.extraEnvVars[0].name=POSTGRESQL_INITSCRIPTS_DIR \
          --set primary.extraEnvVars[0].value=/docker-entrypoint-initdb.d \
          --set primary.resources.requests.memory=256Mi \
          --set primary.resources.requests.cpu=100m \
          --set primary.resources.limits.memory=512Mi \
          --set primary.resources.limits.cpu=500m \
          --set volumePermissions.enabled=true \
          --timeout 600s
        
        echo "=== Waiting for PostgreSQL pod ==="
        for i in {1..60}; do
          POD_NAME=$(kubectl get pods -n rsoi -l app.kubernetes.io/instance=postgres,app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ ! -z "$POD_NAME" ]; then
            echo "PostgreSQL pod found: $POD_NAME"
            break
          fi
          echo "Waiting for PostgreSQL pod to be created... ($i/60)"
          sleep 5
          if [ $i -eq 60 ]; then
            echo "❌ PostgreSQL pod not created after 5 minutes"
            echo "=== Current pods ==="
            kubectl get pods -n rsoi
            echo "=== Helm releases ==="
            helm list -n rsoi
            exit 1
          fi
        done
        
        echo "=== Waiting for PostgreSQL container to be ready ==="
        kubectl wait --for=condition=ContainersReady pod/"$POD_NAME" -n rsoi --timeout=600s
        
        echo "=== Checking database initialization ==="
        for i in {1..30}; do
          if kubectl exec -n rsoi "$POD_NAME" -- psql -U program -d postgres -c "\l" | grep -q "payments"; then
            echo "Database schema initialized successfully"
            break
          fi
          echo "Waiting for database initialization... ($i/30)"
          sleep 5
          if [ $i -eq 30 ]; then
            echo "❌ Database initialization failed"
            echo "=== PostgreSQL logs ==="
            kubectl logs -n rsoi "$POD_NAME" --tail=100
            echo "=== Schema file content ==="
            kubectl exec -n rsoi "$POD_NAME" -- cat /docker-entrypoint-initdb.d/schema-3.sql || true
            exit 1
          fi
        done

    - name: Deploy services
      run: |
        REGISTRY_ID=${{ steps.verify-registry.outputs.registry_id }}
        TIMESTAMP=$(date +%s)
        
        EXTERNAL_IP=""
        for i in {1..15}; do
          EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ ! -z "$EXTERNAL_IP" ] && [ "$EXTERNAL_IP" != "null" ]; then
            break
          fi
          echo "Waiting for external IP... ($i/15)"
          sleep 10
        done
        EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
        echo "External IP: $EXTERNAL_IP"
        
        deploy_service() {
          local name=$1
          local chart=$2
          local values=$3
          
          echo "=== Deploying $name service ==="
          helm upgrade --install "$name" "$chart" \
            --namespace rsoi \
            --set service.name="$name" \
            --set service.image.repository="$REGISTRY_ID/$name" \
            --set service.image.tag="$TIMESTAMP" \
            --set service.readinessProbe.enabled=false \
            --set service.livenessProbe.enabled=false \
            $values
          
          echo "=== Waiting for $name deployment ==="
          kubectl rollout status deployment/"$name" -n rsoi --timeout=120s
          
          echo "=== $name pod logs ==="
          kubectl logs -n rsoi -l app="$name" --tail=10 || true
        }
        
        deploy_service gateway charts/common "--set service.ports.containerPort=8080 --set service.ports.servicePort=80 --set service.env[0].name=CAR_SERVICE_URL --set service.env[0].value=http://cars-service-service.rsoi.svc.cluster.local:80 --set service.env[1].name=RENTAL_SERVICE_URL --set service.env[1].value=http://rental-service-service.rsoi.svc.cluster.local:80 --set service.env[2].name=PAYMENT_SERVICE_URL --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 --set service.env[3].name=PORT --set service.env[3].value=8080"
        
        deploy_service payment-service charts/common "--set service.ports.containerPort=8050 --set service.ports.servicePort=80 --set service.env[0].name=DATABASE_URL --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/postgres --set service.env[1].name=PORT --set service.env[1].value=8050"
        
        deploy_service rental-service charts/common "--set service.ports.containerPort=8060 --set service.ports.servicePort=80 --set service.env[0].name=DATABASE_URL --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/postgres --set service.env[1].name=CAR_SERVICE_URL --set service.env[1].value=http://cars-service-service.rsoi.svc.cluster.local:80 --set service.env[2].name=PAYMENT_SERVICE_URL --set service.env[2].value=http://payment-service-service.rsoi.svc.cluster.local:80 --set service.env[3].name=PORT --set service.env[3].value=8060"
        
        deploy_service cars-service charts/common "--set service.ports.containerPort=8070 --set service.ports.servicePort=80 --set service.env[0].name=DATABASE_URL --set service.env[0].value=postgresql://program:test@postgres-postgresql.rsoi.svc.cluster.local:5432/postgres --set service.env[1].name=PORT --set service.env[1].value=8070"

    - name: Make test script executable
      run: chmod +x ./scripts/test-script.sh

    - name: Run API Tests via direct pod access
      timeout-minutes: 15
      run: |
        echo "=== Starting API tests ==="
        
        # Находим gateway под
        GATEWAY_POD=$(kubectl get pods -n rsoi -l app=gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$GATEWAY_POD" ]; then
          echo "❌ Gateway pod not found!"
          echo "Available pods:"
          kubectl get pods -n rsoi
          exit 1
        fi
        
        echo "Gateway pod: $GATEWAY_POD"
        
        POD_STATUS=$(kubectl get pod -n rsoi "$GATEWAY_POD" -o jsonpath='{.status.phase}')
        echo "Gateway pod status: $POD_STATUS"
        
        echo "=== Gateway pod logs ==="
        kubectl logs -n rsoi "$GATEWAY_POD" --tail=20 || true
        
        if [ "$POD_STATUS" != "Running" ]; then
          echo "❌ Gateway pod is not running"
          exit 1
        fi
        
        echo "=== Starting port-forward ==="
        kubectl port-forward -n rsoi "pod/$GATEWAY_POD" 8080:8080 &
        PORT_FORWARD_PID=$!
        echo "Port-forward PID: $PORT_FORWARD_PID"
        
        echo "=== Waiting for gateway to be ready ==="
        for i in {1..20}; do
          if curl -sSf http://localhost:8080/health >/dev/null 2>&1; then
            echo "Gateway health check passed!"
            break
          fi
          echo "Waiting for gateway... ($i/20)"
          sleep 3
          if [ $i -eq 20 ]; then
            echo "❌ Gateway not responding after 60 seconds"
            echo "=== Curl debug output ==="
            curl -v http://localhost:8080/health || true
            echo "=== Final gateway logs ==="
            kubectl logs -n rsoi "$GATEWAY_POD" --tail=50
            kill $PORT_FORWARD_PID 2>/dev/null || true
            exit 1
          fi
        done
        
        echo "=== Configuring Postman environment ==="
        if [ ! -f "v3/postman/environment.json" ]; then
          echo "❌ environment.json not found!"
          find . -name "environment.json"
          kill $PORT_FORWARD_PID 2>/dev/null || true
          exit 1
        fi
        
        cp v3/postman/environment.json v3/postman/environment.json.backup
        sed -i "s|http://gateway\..*\.nip\.io|http://localhost:8080|g" v3/postman/environment.json
        sed -i "s|http://localhost:8080|http://localhost:8080|g" v3/postman/environment.json
        echo "Updated environment.json:"
        cat v3/postman/environment.json
        
        echo "=== Running API tests ==="
        ./scripts/test-script.sh v3 kubernetes rsoi || {
          echo "❌ Tests failed!"
          echo "=== Test debug information ==="
          curl -v http://localhost:8080/health
          curl -v "http://localhost:8080/api/v1/cars?page=1&size=10&showAll=false"
          kill $PORT_FORWARD_PID 2>/dev/null || true
          exit 1
        }
        
        kill $PORT_FORWARD_PID 2>/dev/null || true
        echo "All tests completed successfully!"
      continue-on-error: false
