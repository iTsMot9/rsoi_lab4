name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up Python for testing
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies and run unit tests
        run: |
          cd src/car-service
          pip install -r requirements.txt
          python -m pytest test_main.py -v
          cd ../..

          cd src/gateway
          pip install -r requirements.txt
          python -m pytest test_main.py -v
          cd ../..

          cd src/payment-service
          pip install -r requirements.txt
          python -m pytest test_main.py -v
          cd ../..

          cd src/rental-service
          pip install -r requirements.txt
          python -m pytest test_main.py -v
          cd ../..
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        timeout-minutes: 10
        run: |
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          docker build -t $DOCKER_USERNAME/car-service:${{ github.sha }} ./src/car-service
          docker push $DOCKER_USERNAME/car-service:${{ github.sha }}

          docker build -t $DOCKER_USERNAME/gateway:${{ github.sha }} ./src/gateway
          docker push $DOCKER_USERNAME/gateway:${{ github.sha }}

          docker build -t $DOCKER_USERNAME/payment-service:${{ github.sha }} ./src/payment-service
          docker push $DOCKER_USERNAME/payment-service:${{ github.sha }}

          docker build -t $DOCKER_USERNAME/rental-service:${{ github.sha }} ./src/rental-service
          docker push $DOCKER_USERNAME/rental-service:${{ github.sha }}

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yandex-cloud -q
          echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
          source "/home/runner/.bashrc"

      - name: Configure Yandex Cloud CLI
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/sa-key.json
          if ! jq empty /tmp/sa-key.json 2>/dev/null; then
              echo "Секрет YC_SERVICE_ACCOUNT_KEY содержит невалидный JSON"
              exit 1
          fi
          yc config set service-account-key /tmp/sa-key.json
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Setup KUBECONFIG
        run: |
          mkdir -p $HOME/.kube
          echo '${{ secrets.KUBECONFIG }}' > $HOME/.kube/config
          sed -i "s|/home/[^/]\+/yandex-cloud/bin/yc|/home/runner/yandex-cloud/bin/yc|g" $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify kubectl connection
        run: kubectl cluster-info && kubectl get nodes

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy PostgreSQL
        run: |
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./postgres/postgres-pvc.yaml -n default
          kubectl apply -f ./postgres/postgres-configmap.yaml -n default
          kubectl apply -f ./postgres/postgres-deployment.yaml -n default
          kubectl apply -f ./postgres/postgres-service.yaml -n default

      - name: Wait for PostgreSQL
        run: kubectl wait -n default deployment/postgres --for=condition=Available --timeout=5m

      - name: Deploy Microservices via Helm
        run: |
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          for service in car-service gateway payment-service rental-service; do
            sed -i "s|tag: latest|tag: ${{ github.sha }}|g" "./charts/apps/$service/values.yaml"
            sed -i "s|repository: placeholder|$DOCKER_USERNAME/$service|g" "./charts/apps/$service/values.yaml"
          done

          helm upgrade --install car-service ./charts/common -f ./charts/apps/car-service/values.yaml -n default
          helm upgrade --install gateway ./charts/common -f ./charts/apps/gateway/values.yaml -n default
          helm upgrade --install payment-service ./charts/common -f ./charts/apps/payment-service/values.yaml -n default
          helm upgrade --install rental-service ./charts/common -f ./charts/apps/rental-service/values.yaml -n default

      - name: Wait for services to be ready
        run: |
          kubectl wait -n default deployment/gateway deployment/car-service deployment/payment-service deployment/rental-service --for=condition=Available --timeout=5m

      - name: Perform basic health checks
        run: |
          kubectl run --rm -it --restart=Never --image=curlimages/curl:latest health-checker \
            --namespace=default \
            --overrides='{"spec":{"hostNetwork": true}}' \
            -- sh -c 'curl -f http://gateway:8080/health || exit 1; curl -f http://car-service:8070/health || exit 1; curl -f http://payment-service:8050/health || exit 1; curl -f http://rental-service:8060/health || exit 1'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
